<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SIRAS</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body class="signin-page">

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo" onclick="window.location.href='../index.html'">
      <img src="../imgs/SIRAS-LOGO.png" alt="SIRAS Logo">
    </div>
    <div class="nav-links">
      <button id="signinBtn">Sign In</button>
      <button id="signupBtn">Sign Up</button>
    </div>
    <div id="google_translate_element"></div>
  </div>
  

  <!-- Sign In Container -->
  <div class="signin-container">
     <h1 class="welcome-title">Welcome Back</h1>
    <div class="signin-box">
      <h1>sign-in</h1>
      <form id="signinForm">
        <div class="role-selection">
    <button type="button" class="buttons role-btn-signin" data-role="owner">OWNER</button>
    <button type="button" class="buttons role-btn-signin" data-role="staff">STAFF</button>
        </div>
        <input type="text" placeholder="User Name" required>
        <input type="password" placeholder="Password" required>

        <!-- Remember Me + Forgot Password -->
        <div class="signin-options">
          <label class="remember">
            <input type="checkbox"> Remember Me
          </label>
          <a href="forget password/forgot_password.html" class="forgot-link" >Forgot Password ?</a>
        </div>

        <!-- Sign In Button -->
        <button type="submit" class="signin-btn">SIGN IN</button>

        <!-- Sign Up redirect -->
        <p class="signup-redirect">
          Don’t have an account? <a href="../sign-up/signup.html">Sign Up</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Google Translate Script -->
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
    }
  </script>
  <script>
    document.getElementById('signupBtn').addEventListener('click', function() {
      window.location.href = '../sign-up/signup.html';
    });
  </script>

  
<script>
  const roleButtons = document.querySelectorAll(".role-btn-signin");
  const roleInput = document.getElementById("roleInput");
  let selectedRole = "";

  roleButtons.forEach(button => {
    button.addEventListener("click", () => {
      // Reset active state
      roleButtons.forEach(btn => btn.classList.remove("active"));
      // Set active for clicked
      button.classList.add("active");
      // Save role
      selectedRole = button.dataset.role;
      roleInput.value = selectedRole; // hidden field
    });
  });

  const signinForm = document.getElementById("signinForm");
  const passwordInput = document.getElementById("password");

  // On form submit
  signinForm.addEventListener("submit", (e) => {
    e.preventDefault();

    // Redirect by role
    if (selectedRole === "owner") {
      window.location.href = "../owner/owner.html";
    } else if (selectedRole === "staff") {
      window.location.href = "../staff/staff.html";
    }
  });

</script>


</body>
</html>
