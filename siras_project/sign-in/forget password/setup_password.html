<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Password - SIRAS</title>
  <link rel="stylesheet" href="password.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body class="setup-page">


  <!-- Setup Password Container -->
  <div class="signin-container">
    <div class="signin-box">
      <h1>Set Up New Password</h1>
      <p>Create a strong password for your account.</p>
      
      <form action="#">
        <input type="password" placeholder="New Password" required>
        <input type="password" placeholder="Confirm Password" required>
        
        <button type="submit" class="signin-btn">Save Password</button>

        <p class="signup-redirect">
          Back to <a href="sign-in/signin.html">Sign In</a>
        </p>
      </form>
    </div>
  </div>


  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
    }
    document.getElementById('signupBtn').addEventListener('click', function() {
      window.location.href = '../sign-up/signup.html';
    });
    document.getElementById('signinBtn').addEventListener('click', function() {
      window.location.href = '../sign-in/signin.html';
    });
  </script>
</body>
</html>
