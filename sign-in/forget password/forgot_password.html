<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - SIRAS</title>
  <link rel="stylesheet" href="password.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body class="forgot-page">


  <!-- Forgot Password Container -->
    <div class="signin-box">
      <h1>Forgot Password</h1>
      <p>Please enter your registered email to reset your password.</p>
      
      <form action="#">
        <input type="email" placeholder="Enter your email" required>
        
        <button type="submit" class="signin-btn">Send Reset Link</button>

        <p class="signup-redirect">
          Remembered your password? <a href="../signin.html">Sign In</a>
        </p>
      </form>
    </div>

 
 
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
    }
    document.getElementById('signupBtn').addEventListener('click', function() {
      window.location.href = '../sign-up/signup.html';
    });
    document.getElementById('signinBtn').addEventListener('click', function() {
      window.location.href = '../sign-in/signin.html';
    });
  </script>
</body>
</html>
